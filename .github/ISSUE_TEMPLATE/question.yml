name: Integration question
description: Ask for help using the package after checking the documentation.
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to build?
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include a minimal, sanitized code sample.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Relevant versions
      placeholder: Package, React, Next.js, and YARL versions

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed private images, GPS data, serial numbers, emails, and credentials.
          required: true
